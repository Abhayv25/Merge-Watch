name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Lambda image
        run: docker build -t mergewatch:ci .
      - name: Smoke test
        run: |
          docker run --rm --entrypoint git mergewatch:ci --version
          docker run --rm --entrypoint python mergewatch:ci -c "import src.lambda_handler, awslambdaric"
          docker image inspect mergewatch:ci --format 'image size: {{.Size}} bytes'

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend=false
      - run: terraform validate
