name: Mergewatch (manual run)

# The scheduled run now lives on AWS Lambda (see infra/). GitHub Actions'
# cron is best-effort: on this repo a 15-minute schedule fired 5 times in
# about 18 hours. This workflow stays for one-off manual checks.
on:
  workflow_dispatch: {}

jobs:
  check-for-collisions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          # git merge-tree needs real history to find a common ancestor.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Mergewatch
        run: python -m src.main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGEWATCH_WEBHOOK_URL: ${{ secrets.MERGEWATCH_WEBHOOK_URL }}
