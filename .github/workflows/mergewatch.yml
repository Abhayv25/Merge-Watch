name: Mergewatch

on:
  schedule:
    # Runs every 15 minutes. Cron is in UTC. Adjust once it's working --
    # more frequent means faster warnings, less frequent means fewer Actions minutes used.
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab, useful while testing

jobs:
  check-for-collisions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          # IMPORTANT: git merge-tree needs real commit history to find a common
          # ancestor between branches. A shallow clone (the default) will break this.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Mergewatch
        run: python -m src.main
        env:
          # GITHUB_TOKEN is provided automatically by Actions -- no secret to create for this one.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Add this as a repo secret (Settings -> Secrets and variables -> Actions)
          # once you're ready to actually post notifications.
          MERGEWATCH_WEBHOOK_URL: ${{ secrets.MERGEWATCH_WEBHOOK_URL }}
